name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# A retry for the same tag must reuse its draft release rather than create another.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Find or create draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.ref || ''
            const tagName = ref.replace('refs/tags/', '').replace('refs/heads/', '')
            if (!tagName) {
              throw new Error('No tag or branch name found in context.ref')
            }
            const version = tagName.startsWith('v') ? tagName.slice(1) : tagName

            // Reuse an existing draft (including on workflow retries).
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName
              })
              return data.id
            } catch (error) {
              if (error.status !== 404) throw error
            }

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `Urz v${version}`,
              body: `Release of Urz v${version}`,
              draft: true,
              prerelease: false
            })
            return data.id

  build-linux:
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          appVersion: ${{ github.ref_name }}
          projectPath: src-tauri
          tauriScript: npx @tauri-apps/cli@2

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          appVersion: ${{ github.ref_name }}
          projectPath: src-tauri
          args: build --no-bundle
          tauriScript: npx @tauri-apps/cli@2

  build-macos-intel:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          appVersion: ${{ github.ref_name }}
          projectPath: src-tauri
          args: --target x86_64-apple-darwin
          tauriScript: npx @tauri-apps/cli@2

  build-macos-arm:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          appVersion: ${{ github.ref_name }}
          projectPath: src-tauri
          args: --target aarch64-apple-darwin
          tauriScript: npx @tauri-apps/cli@2

  build-android:
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java for Android
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973 cmake;3.22.1

      - name: Set NDK environment variables
        run: |
          export NDK_PATH=/usr/local/lib/android/sdk/ndk/27.0.12077973
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> $GITHUB_ENV
          echo "NDK_HOME=${NDK_PATH}" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            liblzma-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Build Android APK
        run: npx @tauri-apps/cli@2 android build --apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign Android APK
        id: sign_apk
        run: |
          UNSIGNED_APK=$(find src-tauri -name "*.apk" | grep "release" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then echo "APK not found"; exit 1; fi
          VERSION=${{ github.ref_name }}
          if [[ "$VERSION" == "main" ]]; then VERSION="latest"; fi
          SIGNED_APK="Urz-$VERSION-android-signed.apk"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | head -n 1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found"; exit 1; fi
          $APKSIGNER sign --ks release.jks --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} --out "$SIGNED_APK" "$UNSIGNED_APK"
          echo "apk_path=$SIGNED_APK" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload signed Android APK to the existing release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          APK_PATH: ${{ steps.sign_apk.outputs.apk_path }}
        with:
          script: |
            const fs = require('fs')
            const path = process.env.APK_PATH
            const name = require('path').basename(path)
            const releaseId = Number(process.env.RELEASE_ID)

            // Replace the asset on a retry instead of creating a duplicate.
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId
            })
            const existing = assets.find(asset => asset.name === name)
            if (existing) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: existing.id
              })
            }

            const data = fs.readFileSync(path)
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name,
              data,
              headers: {
                'content-type': 'application/vnd.android.package-archive',
                'content-length': data.length
              }
            })

  publish-release:
    needs:
      - create-release
      - build-linux
      - build-windows
      - build-macos-intel
      - build-macos-arm
      - build-android
    runs-on: ubuntu-24.04
    steps:
      - name: Publish release after all assets are uploaded
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false
            })

