name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Create GitHub Release (runs first)
  create-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true

  # Linux Desktop
  build-linux:
    needs: [create-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build Tauri App (Linux)
        run: cargo tauri build --bundles deb

      - name: Rename and collect artifacts
        run: |
          mkdir -p dist/linux
          cp src-tauri/target/release/bundle/deb/*.deb dist/linux/urz-linux-amd64.deb
          cp src-tauri/target/release/urz dist/linux/urz-linux-amd64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: dist/linux/*

  # Windows Desktop (Portable EXE only)
  build-windows:
    needs: [create-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install WebView2
        run: |
          Start-Process msiexec.exe -Wait -ArgumentList '/i https://go.microsoft.com/fwlink/p/?LinkId=2124703 /quiet'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build Tauri App (Windows Portable)
        run: cargo tauri build --bundles portable

      - name: Rename and collect artifacts
        run: |
          mkdir -p dist/windows
          Copy-Item "src-tauri/target/release/urz.exe" "dist/windows/urz-win-x64.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/windows/*

  # macOS Desktop
  build-macos:
    needs: [create-release]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build Tauri App (macOS)
        run: cargo tauri build --bundles dmg

      - name: Rename and collect artifacts
        run: |
          mkdir -p dist/macos
          cp src-tauri/target/release/bundle/dmg/*.dmg dist/macos/urz-macos.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/macos/*

  # Android (ARM64 v8a for Android 9+)
  build-android:
    needs: [create-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            openjdk-17-jdk \
            clang \
            cmake \
            unzip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Add Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9.0
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.2.9519653'

      - name: Set Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_ENV

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build Tauri App (Android ARM64)
        run: cargo tauri android build --target aarch64-linux-android --release

      - name: Rename and collect artifacts
        run: |
          mkdir -p dist/android
          find src-tauri/target/aarch64-linux-android/release -name "*.apk" -exec cp {} dist/android/urz-android-arm64-v8a.apk \;

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: dist/android/*

  # iOS (requires macOS runner)
  build-ios:
    needs: [create-release]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build Tauri App (iOS)
        run: cargo tauri ios build --release

      - name: Rename and collect artifacts
        run: |
          mkdir -p dist/ios
          cp -r src-tauri/target/ios-release/iphoneos/*.ipa dist/ios/urz-ios.ipa 2>/dev/null || echo "IPA not found, copying .app"
          cp -r src-tauri/target/ios-release/iphoneos/Urz.app dist/ios/Urz.app 2>/dev/null || true

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: dist/ios/*
